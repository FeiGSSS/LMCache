    num-users: 300
    max-inflight-requests: 1
    new-user-rate: 0.05
    duration-sec: 120
    seed: 41
    think-base-sec: 1.0
    read-tok-per-sec: 5.0
    think-sigma: 0.6
    max-context-tokens: 8192
    max-output-tokens: 1
    request-timeout-sec: 120

