# LMCache KV Quantization Configuration for TTFT Test
# 4-bit KIVI-style quantization

# KV Cache Quantization Settings
enable_kv_quantization: true          # Enable KIVI-style quantization
kv_quantization_bits: 4               # Quantization bits: 2, 4, or 8
kv_quantization_group_size: 128       # Group size for quantization

# Cache Settings
chunk_size: 256                       # Chunk size for KV cache
local_cpu: True                       # Enable CPU offloading
max_local_cpu_size: 150               # CPU cache size (handles ~100GB+ KV cache)
save_unfull_chunk: False              # Only save complete chunks
